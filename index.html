<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>REALMFALL 5.0</title><script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:#03050a;--p:#090e18eF;--p2:#0d1522;--line:#2a3a55;--txt:#edf5ff;--muted:#8291a9;--cyan:#62e9ff;--gold:#f2c766;--red:#ff5f7f;--green:#6dffab}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:var(--txt);font-family:Inter,system-ui,Segoe UI,Arial}button,input{font:inherit}button{cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%}.overlay{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#152642aa,#02040af5 72%);backdrop-filter:blur(8px)}
.panel{width:min(1050px,94vw);border:1px solid #354865;background:linear-gradient(145deg,#0c1422f7,#060a12f7);border-radius:28px;padding:36px;box-shadow:0 40px 120px #000;position:relative;overflow:hidden}.panel:before{content:"";position:absolute;inset:-2px;background:linear-gradient(110deg,transparent,#5de8ff10,transparent,#f2c76610,transparent);pointer-events:none}
.logo{font-size:clamp(45px,8vw,92px);font-weight:1000;letter-spacing:.12em;line-height:.88;text-shadow:0 0 45px #5de8ff33}.logo small{display:block;font-size:11px;letter-spacing:.5em;color:var(--gold);margin-top:17px}
.sub{max-width:760px;color:#a8b6cb;line-height:1.65;margin:25px 0}.row{display:flex;gap:11px;flex-wrap:wrap}.btn{border:1px solid #3a4d69;background:#101a2b;color:#fff;padding:14px 20px;border-radius:13px;font-weight:900;transition:.15s}.btn:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 12px 35px #000}.primary{background:linear-gradient(135deg,#138ca9,#3158da);border:0}.gold{background:linear-gradient(135deg,#9c671b,#f0c25f);color:#101010;border:0}
input{width:100%;background:#070c15;border:1px solid #32435f;color:#fff;border-radius:12px;padding:14px;outline:none}.field{display:flex;gap:10px;max-width:560px}
#lobby{display:none}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.card{background:#07101be8;border:1px solid #263750;border-radius:18px;padding:19px}.label{font-size:10px;letter-spacing:.18em;color:#74849c}.code{font-size:45px;color:var(--cyan);font-weight:1000;letter-spacing:.18em;margin:7px 0 12px}
#hud{display:none;position:fixed;inset:0;z-index:4;pointer-events:none}.top{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 13px;border:1px solid #30415d;background:#06101be8;border-radius:12px;font-weight:850;backdrop-filter:blur(12px)}
.party{position:absolute;top:70px;left:15px;width:270px}.member{display:flex;gap:9px;align-items:center;padding:9px;margin:5px 0;border:1px solid #203049;border-radius:11px;background:#050b14}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}.dot.dead{background:var(--red);box-shadow:0 0 14px var(--red)}
.boss{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:min(680px,60vw);text-align:center}.boss h2{margin:0;font-size:18px;letter-spacing:.22em}.boss p{margin:5px;color:#8998b0;font-size:10px;letter-spacing:.15em}.bar{height:15px;border:1px solid #806633;background:#080a0f;border-radius:99px;padding:2px}.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#a96b1e,#ffe39c,#b67a27);box-shadow:0 0 20px #f4c65b}
.bottom{position:absolute;left:15px;right:15px;bottom:15px;display:flex;justify-content:space-between;align-items:end}.stats{width:330px}.meter{height:10px;border:1px solid #25364f;background:#060a11;border-radius:99px;overflow:hidden;margin:4px 0 8px}.meter i{display:block;height:100%}.hp i{background:linear-gradient(90deg,#9c183f,#ff6b88)}.en i{background:linear-gradient(90deg,#1175b0,#6eeaff)}.xp i{background:linear-gradient(90deg,#6b4ee0,#c0a6ff)}.abilities{display:flex;gap:9px}.ability{width:74px;height:70px;border:1px solid #334762;background:#07101ce8;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}.ability b{font-size:21px}.ability span{font-size:9px;color:#8492a9;margin-top:4px}
#inventory{display:none;position:fixed;inset:0;z-index:9;background:#02040ad9;backdrop-filter:blur(14px);align-items:center;justify-content:center}.inv{width:min(1150px,95vw);height:min(760px,92vh);background:linear-gradient(145deg,#0a111d,#060a12);border:1px solid #3a4b67;border-radius:25px;box-shadow:0 40px 130px #000;display:grid;grid-template-columns:260px 1fr;overflow:hidden}.side{padding:22px;border-right:1px solid #253650;background:#070d17}.side h1{font-size:22px;margin:0 0 5px}.nav{display:grid;gap:8px;margin-top:25px}.nav button{text-align:left;border:1px solid #263750;background:#0b1421;color:#c8d4e6;padding:12px;border-radius:11px}.nav button.active{border-color:var(--cyan);background:#102231;color:#fff}.main{padding:25px;overflow:auto}.invHead{display:flex;justify-content:space-between;align-items:start}.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:17px 0}.stat{padding:14px;border:1px solid #263750;background:#09111d;border-radius:13px}.stat b{display:block;font-size:23px;margin-top:5px}.section{margin-top:22px}.section h2{font-size:13px;letter-spacing:.15em;color:#93a3bb}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{border:1px solid #263750;background:linear-gradient(145deg,#0b1421,#070c14);border-radius:14px;padding:13px;min-height:105px}.rarity{font-size:9px;letter-spacing:.15em;color:var(--gold)}.item h3{margin:5px 0;font-size:14px}.item p{margin:0;color:#8190a8;font-size:11px;line-height:1.45}
#shop{display:none;position:fixed;inset:0;z-index:10;align-items:center;justify-content:center;background:#02040adf}.shop{width:min(980px,94vw);padding:27px;background:#0a111d;border:1px solid #3a4b67;border-radius:24px;box-shadow:0 40px 120px #000}.shopGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.shopItem{border:1px solid #263750;background:#080f1a;border-radius:15px;padding:16px}.shopItem h3{margin:0 0 6px}.shopItem p{color:#8392aa;font-size:11px;min-height:38px}.shopItem button{width:100%;border:1px solid #3a4d69;background:#101a2a;color:white;border-radius:10px;padding:10px}
#toast{display:none;position:fixed;z-index:20;top:28%;left:50%;transform:translateX(-50%);padding:13px 18px;border:1px solid #415673;background:#07101df2;border-radius:13px;box-shadow:0 25px 70px #000}
@media(max-width:800px){.grid{grid-template-columns:1fr}.party{display:none}.boss{width:70vw}.stats{width:230px}.inv{grid-template-columns:1fr}.side{display:none}.statGrid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.shopGrid{grid-template-columns:repeat(2,1fr)}.ability{width:57px;height:57px}}
.regionBanner{position:fixed;top:82px;left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;pointer-events:none;z-index:7;text-align:center;transition:.5s}.regionBanner.show{opacity:1;transform:translateX(-50%) translateY(0)}.regionBanner b{display:block;font-size:12px;letter-spacing:.32em}.regionBanner span{display:block;margin-top:5px;color:#8c9ab0;font-size:9px;letter-spacing:.18em}.bossPulse{animation:bossPulse .65s ease}.abilityHot{border-color:#ffe08a!important;box-shadow:0 0 25px #ffcf5a55}.shopAbility{grid-column:1/-1;border-color:#7b66ff!important;background:linear-gradient(145deg,#12102a,#090b16)!important}.abilityGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.abilityCard{border:1px solid #293a58;background:#0a111d;border-radius:12px;padding:12px}.abilityCard button{margin-top:8px;width:100%}@keyframes bossPulse{50%{transform:translateX(-50%) scale(1.03);filter:brightness(1.5)}}</head><body>
<canvas id="c"></canvas>
<div id="menu" class="overlay"><div class="panel"><div class="logo">REALMFALL<small>ULTRA // ONLINE CO-OP ASCENSION</small></div><div class="sub">Climb 60 floors with your squad. Build your tank with cards and relics, open your tactical inventory with <b>E</b>, buy upgrades in safe zones and defeat 20 bosses with unique attack sets.</div><div class="field"><input id="name" maxlength="16" placeholder="Tank callsign" value="Pilot"></div><div class="row" style="margin-top:12px"><button class="btn primary" id="create">CREATE LOBBY</button><button class="btn" id="showJoin">JOIN FRIEND</button></div><div id="joinBox" style="display:none;margin-top:12px"><div class="field"><input id="joinCode" maxlength="5" placeholder="5-character code"><button class="btn" id="join">JOIN</button></div></div><div style="margin-top:22px;color:#65758e;font-size:11px">WASD / arrows move • mouse aim • click fire • Space dash • Q EMP • R missile • F ability • E inventory</div></div></div>
<div id="lobby" class="overlay"><div class="panel"><div class="logo" style="font-size:46px">SQUAD DEPLOYMENT</div><div class="grid" style="margin-top:20px"><div class="card"><div class="label">SECURE LOBBY CODE</div><div class="code" id="code">-----</div><div class="sub" style="margin:0 0 18px">Send this code to friends. Everyone joins the same real-time server room.</div><div class="row"><button class="btn primary" id="start">START ASCENSION</button><button class="btn gold" id="ready">READY UP</button><button class="btn" id="leave">LEAVE</button></div><div style="margin-top:12px"><select id="mode" class="btn" style="width:240px"><option>NORMAL</option><option>HARD</option><option>NIGHTMARE</option><option>ENDLESS</option></select></div></div><div class="card"><div class="label">PARTY</div><div id="slots"></div><div style="margin-top:16px;color:#65758e;font-size:11px">Non-host players must Ready Up before the host launches.</div></div></div></div></div>
<div id="regionBanner" class="regionBanner"><b id="regionTitle">REGION</b><span id="regionSub">ASCENSION ZONE</span></div><div id="hud"><div class="top"><div class="chips"><div class="chip">FLOOR <span id="floor">1</span>/60</div><div class="chip" id="region">REGION</div><div class="chip">G <span id="gold">0</span></div><div class="chip">LV <span id="lvl">1</span></div></div><div class="chip" id="objective">OBJECTIVE</div></div><div class="party card" id="party"></div><div class="boss" id="bossUI" style="display:none"><h2 id="bossName">BOSS</h2><p id="bossPhase">PHASE I</p><div class="bar"><i id="bossHP"></i></div></div><div class="bottom"><div class="stats"><div class="label">VITALITY</div><div class="meter hp"><i id="hp"></i></div><div class="label">ENERGY</div><div class="meter en"><i id="energy"></i></div><div class="label">XP</div><div class="meter xp"><i id="xp"></i></div></div><div class="abilities"><div class="ability"><b>⚡</b><span>Q • EMP</span></div><div class="ability"><b>➤</b><span>SPACE • DASH</span></div><div class="ability"><b>🚀</b><span>R • MISSILE</span></div><div class="ability" id="abilitySlot"><b>✦</b><span>F • ABILITY</span></div><div class="ability"><b>🎒</b><span>E • INVENTORY</span></div></div></div></div>
<div id="inventory"><div class="inv"><aside class="side"><h1>TACTICAL CORE</h1><div class="label">RUN LOADOUT</div><div class="nav"><button class="active" data-tab="stats">OVERVIEW</button><button data-tab="cards">CARDS</button><button data-tab="abilities">ABILITIES</button><button data-tab="relics">RELICS</button></div><div style="position:absolute;bottom:25px;color:#65758d;font-size:11px">Press E to close</div></aside><main class="main"><div class="invHead"><div><div class="label">PILOT PROFILE</div><h1 style="margin:5px 0" id="invName">Tank</h1><div style="color:#7f8ea5;font-size:11px">Build your machine. Every choice changes the run.</div></div><button class="btn" id="closeInv">CLOSE [E]</button></div><div id="invContent"></div></main></div></div>
<div id="victory" class="overlay" style="display:none"><div class="panel" style="text-align:center"><div class="logo" style="font-size:58px">ASCENSION COMPLETE</div><p class="sub" style="margin-left:auto;margin-right:auto">The 60-floor Realmfall has been conquered.</p><div id="victoryStats" class="card" style="text-align:left"></div><div class="row" style="justify-content:center;margin-top:18px"><button class="btn gold" id="endless">CONTINUE IN ENDLESS</button><button class="btn" id="returnMenu">RETURN TO MENU</button></div></div></div><div id="shop"><div class="shop"><div style="display:flex;justify-content:space-between"><div><div class="label">SAFE ZONE</div><h1 style="margin:4px 0">ARMORY // BLACK MARKET</h1></div><button class="btn" id="closeShop">CLOSE</button></div><div class="shopGrid" style="margin-top:18px"><div class="shopItem"><h3>Card Cache</h3><p>Buy a random card and permanently apply its stats to this run.</p><button data-buy="card">130 G</button></div><div class="shopItem"><h3>Relic Vault</h3><p>Buy a random relic with a powerful run modifier.</p><button data-buy="relic">240 G</button></div><div class="shopItem"><h3>Full Repair</h3><p>Restore your tank to full vitality.</p><button data-buy="heal">90 G</button></div><div class="shopItem"><h3>Weapon Tune</h3><p>+12 damage and +5 armor.</p><button data-buy="upgrade">190 G</button></div><div class="shopItem"><h3>Treasure Contract</h3><p>Trade credits for a card and relic immediately.</p><button data-buy="treasure">260 G</button></div><div class="shopItem shopAbility"><h3>ABILITY ARMORY</h3><p>Buy tactical abilities here, then equip them from your inventory.</p><div id="shopAbilities" class="abilityGrid"></div></div></div></div></div><div id="toast"></div>
<script>
const socket=io(),c=document.getElementById("c"),ctx=c.getContext("2d");let W=innerWidth,H=innerHeight,dpr=Math.min(2,devicePixelRatio||1),state=null,code="",myId=null,keys={},mouse={x:0,y:0,down:false},inv=false,tab="stats",token=localStorage.getItem("rf6_token")||Math.random().toString(36).slice(2);localStorage.setItem("rf6_token",token);
const $=x=>document.getElementById(x);function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();socket.on("connect",()=>socket.emit("reconnect",{token},r=>{if(r?.ok){code=r.code;myId=socket.id;openLobby()}}));
function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").style.display="none",1800)}
$("showJoin").onclick=()=>{$("joinBox").style.display="block"};$("create").onclick=()=>socket.emit("createRoom",{name:$("name").value,token},r=>{if(r.ok){code=r.code;token=r.token||token;localStorage.setItem("rf6_token",token);myId=socket.id;openLobby()}else toast(r.error)});
$("join").onclick=()=>socket.emit("joinRoom",{code:$("joinCode").value,name:$("name").value,token},r=>{if(r.ok){code=r.code;token=r.token||token;localStorage.setItem("rf6_token",token);myId=socket.id;openLobby()}else toast(r.error)});
$("start").onclick=()=>socket.emit("start",code);$("ready").onclick=()=>{let me=state?.players.find(p=>p.id===myId);socket.emit("setReady",code,!me?.ready);$("ready").textContent=me?.ready?"READY UP":"UNREADY"};$("mode").onchange=()=>socket.emit("setMode",{code,mode:$("mode").value});$("leave").onclick=()=>location.reload();function openLobby(){$("menu").style.display="none";$("lobby").style.display="flex";$("code").textContent=code}
socket.on("state",s=>{state=s;if(!myId)myId=socket.id;update();if(s.victory){$("victory").style.display="flex";let me=s.players.find(p=>p.id===myId);$("victoryStats").innerHTML=`<b>FINAL RUN</b><br>Floors: ${s.floor}<br>Kills: ${me?.kills||0}<br>Gold: ${me?.gold||0}<br>Level: ${me?.level||1}`;}else $("victory").style.display="none";if(s.started){$("lobby").style.display="none";$("hud").style.display="block";if(s.floorDef.type==="SHOP")$("shop").style.display="flex"}else if(s.gameOver)toast("SQUAD DOWN")});
function update(){if(!state)return;let me=state.players.find(p=>p.id===myId);$("floor").textContent=state.floor;$("region").textContent=state.floorDef.region;$("objective").textContent=state.floorDef.objective||state.floorDef.type;
let rs=state.floorDef.regionStyle||{};document.documentElement.style.setProperty("--cyan",rs.accent||"#62e9ff");if(lastFloor!==state.floor){lastFloor=state.floor;$("regionTitle").textContent=(rs.title||state.floorDef.region);$("regionSub").textContent=`FLOOR ${state.floor} • ${state.floorDef.type} • ${state.floorDef.objective}`;$("regionBanner").classList.add("show");setTimeout(()=>$("regionBanner").classList.remove("show"),2600);tone(260,.18,"triangle",.03)}
$("slots").innerHTML=state.players.map(p=>`<div class="member"><i class="dot ${p.online===false?"dead":""}"></i><div style="flex:1"><b>${esc(p.name)}</b><div style="font-size:10px;color:#8190a8">${p.ready?"READY":"NOT READY"}${p.online===false?" • OFFLINE":""}</div></div></div>`).join("");$("party").innerHTML=state.players.map(p=>`<div class="member"><i class="dot ${p.downed?"dead":""}"></i><div style="flex:1"><b>${esc(p.name)}</b><div style="font-size:10px;color:#8190a8">${p.downed?"DOWNED":"HP "+Math.round(p.hp)+" / "+p.maxHp}</div></div><strong>LV${p.level}</strong></div>`).join("");
if(!me)return;$("gold").textContent=me.gold;$("lvl").textContent=me.level;$("hp").style.width=me.hp/me.maxHp*100+"%";$("energy").style.width=me.energy/me.maxEnergy*100+"%";$("xp").style.width=me.xp/(me.level*100)*100+"%";
if(state.boss){$("bossUI").style.display="block";$("bossName").textContent=state.boss.name;if(lastBoss!==state.boss.name){lastBoss=state.boss.name;sfx("boss");$("bossUI").classList.add("bossPulse");setTimeout(()=>$("bossUI").classList.remove("bossPulse"),700)}$("bossPhase").textContent=(state.boss.phase===2?"PHASE II • ":"PHASE I • ")+state.boss.moves[state.boss.phase===2?1:0].toUpperCase();$("bossHP").style.width=Math.max(0,state.boss.hp/state.boss.maxHp*100)+"%"}else {$("bossUI").style.display="none";lastBoss=""}
if(me){$("abilitySlot").classList.toggle("abilityHot",me.abilityCd<=0&&me.energy>=35);$("abilitySlot").querySelector("span").textContent=`F • ${me.abilityName||"ABILITY"} ${me.abilityCd>0?Math.ceil(me.abilityCd)+"s":"READY"}`}renderShopAbilities();if(inv)renderInv(me)}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function renderInv(p){$("invName").textContent=p.name+" // LEVEL "+p.level;let content="";
if(tab==="stats")content=`<div class="statGrid"><div class="stat"><span class="label">DAMAGE</span><b>${Math.round(p.damage)}</b></div><div class="stat"><span class="label">ARMOR</span><b>${Math.round(p.armor)}</b></div><div class="stat"><span class="label">MAX HP</span><b>${Math.round(p.maxHp)}</b></div><div class="stat"><span class="label">SPEED</span><b>${Math.round(p.speed)}</b></div><div class="stat"><span class="label">ENERGY</span><b>${Math.round(p.maxEnergy)}</b></div><div class="stat"><span class="label">FIRE RATE</span><b>${p.fireRate.toFixed(2)}s</b></div><div class="stat"><span class="label">KILLS</span><b>${p.kills}</b></div><div class="stat"><span class="label">GOLD</span><b>${p.gold}</b></div></div><div class="section"><h2>CURRENT BUILD</h2><div class="cards"><div class="item"><div class="rarity">WEAPON</div><h3>${p.weapon}</h3><p>Primary tank cannon.</p></div><div class="item"><div class="rarity">TACTICAL</div><h3>${p.ability}</h3><p>EMP disables enemies in a wide radius.</p></div><div class="item"><div class="rarity">PROGRESS</div><h3>${p.xp}/${p.level*100} XP</h3><p>Next level improves core stats.</p></div></div></div>`;
else if(tab==="cards")content=`<div class="section"><h2>EQUIPPED / COLLECTED CARDS (${p.cards.length})</h2><div class="cards">${p.cards.length?p.cards.map(n=>{let c=state.cards.find(x=>x[0]===n)||["Unknown","COMMON","",0];return `<div class="item"><div class="rarity">${c[1]}</div><h3>${esc(c[0])}</h3><p>${esc(c[2])}</p></div>`}).join(""):`<div class="item"><h3>No cards yet</h3><p>Buy Card Caches in shop floors or earn cards after clearing floors.</p></div>`}</div></div>`;
else if(tab==="relics")content=`<div class="section"><h2>RELIC VAULT (${p.relics.length})</h2><div class="cards">${p.relics.length?p.relics.map(n=>{let r=state.relics.find(x=>x[0]===n)||[n,""];return `<div class="item"><div class="rarity">RELIC</div><h3>${esc(r[0])}</h3><p>${esc(r[1])}</p></div>`}).join(""):`<div class="item"><h3>Empty vault</h3><p>Relics can be bought or earned during the run.</p></div>`}</div></div>`;
else content=`<div class="section"><h2>TACTICAL ABILITIES</h2><div class="cards">${(state.abilities||[]).map(a=>{let owned=p.abilities?.includes(a[0]),eq=p.equippedAbility===a[0];return `<div class="item"><div class="rarity">${a[2]} • ${a[6]} ENERGY</div><h3>${esc(a[1])}${eq?" • EQUIPPED":""}</h3><p>${esc(a[3])}</p>${owned&&!eq?`<button class="btn" onclick="equipAbility('${a[0]}')">EQUIP</button>`:""}</div>`}).join("")}</div></div>`;
$("invContent").innerHTML=content}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");tab=b.dataset.tab;let p=state?.players.find(x=>x.id===myId);if(p)renderInv(p)});
function equipAbility(id){socket.emit("buy",{code,kind:"equipAbility",id},r=>{if(r?.ok)toast("ABILITY EQUIPPED");else toast("Ability unavailable")})}
function renderShopAbilities(){let box=$("shopAbilities");if(!box||!state)return;let p=state.players.find(x=>x.id===myId);box.innerHTML=(state.abilities||[]).map(a=>{let owned=p?.abilities?.includes(a[0]);return `<div class="abilityCard"><b>${esc(a[1])}</b><div class="rarity">${a[2]} • ${a[4]} G</div><p>${esc(a[3])}</p>${owned?`<button class="btn" onclick="equipAbility('${a[0]}')">EQUIP</button>`:`<button class="btn gold" onclick="buyAbility('${a[0]}')">BUY ${a[4]} G</button>`}</div>`}).join("")}
function buyAbility(id){socket.emit("buy",{code,kind:"ability",id},r=>{if(r?.ok){toast("ABILITY ACQUIRED");renderShopAbilities()}else toast("Not enough gold or already owned")})}
function toggleInv(){if(!state?.started)return;inv=!inv;$("inventory").style.display=inv?"flex":"none";if(inv){let p=state.players.find(x=>x.id===myId);renderInv(p)}}
$("closeInv").onclick=toggleInv;document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>socket.emit("buy",{code,kind:b.dataset.buy},r=>{if(!r?.ok)toast("Not enough gold")}));
$("closeShop").onclick=()=>{$("shop").style.display="none";if(state?.host===myId)socket.emit("nextFloor",code)};$("endless").onclick=()=>{if(state?.host===myId){socket.emit("setMode",{code,mode:"ENDLESS"});socket.emit("nextFloor",code)}$("victory").style.display="none"};$("returnMenu").onclick=()=>location.reload();
addEventListener("keydown",e=>{let k=e.key.toLowerCase();if(k==="e"&&!e.repeat){toggleInv();return}if(inv)return;keys[k]=true;if(k==="f"&&!e.repeat)sfx("ability");if(k==="q"&&!e.repeat)sfx("emp");if(k==="r"&&!e.repeat)sfx("missile");if(e.code==="Space"&&!e.repeat)sfx("dash");if(e.code==="Space")keys.space=true;if(k==="n"&&state?.completed&&state.host===myId)socket.emit("nextFloor",code)});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;if(e.code==="Space")keys.space=false});c.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});c.addEventListener("mousedown",()=>mouse.down=true);addEventListener("mouseup",()=>mouse.down=false);
setInterval(()=>{if(!state?.started||inv)return;let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),p=state.players.find(x=>x.id===myId);if(!p)return;let scale=Math.min(W/state.world.w,H/state.world.h)*1.35,tx=p.x+(mouse.x-W/2)/scale,ty=p.y+(mouse.y-H/2)/scale;socket.emit("input",{code,x,y,fire:mouse.down,tx,ty,dash:keys.space,emp:keys.q,missile:keys.r,ability:keys.f});if(mouse.down&&performance.now()-lastShot>120){sfx("shoot");lastShot=performance.now()}keys.space=keys.q=keys.r=keys.f=false},33);
function draw(){requestAnimationFrame(draw);ctx.clearRect(0,0,W,H);if(!state){stars();return}let p=state.players.find(x=>x.id===myId);if(!p){stars();return}let sc=Math.min(W/state.world.w,H/state.world.h)*1.35,cx=Math.max(0,Math.min(state.world.w-W/sc,p.x-W/(2*sc))),cy=Math.max(0,Math.min(state.world.h-H/sc,p.y-H/(2*sc)));ctx.save();ctx.scale(sc,sc);ctx.translate(-cx,-cy);world();ctx.restore()}
function stars(){ctx.fillStyle="#fff";for(let i=0;i<90;i++){ctx.globalAlpha=.18+(i%6)/12;ctx.fillRect((i*97)%W,(i*43)%H,1,1)}ctx.globalAlpha=1}
function world(){let th=state.floorDef.theme,bg={forest:"#07140f",fire:"#180907",ice:"#07141e",storm:"#090b19",iron:"#0d0e12",void:"#100818",crystal:"#090b1b",celestial:"#0b0e1a"}[th]||"#060912";ctx.fillStyle=bg;ctx.fillRect(0,0,state.world.w,state.world.h);ctx.strokeStyle="#16243a";ctx.lineWidth=3;for(let x=0;x<state.world.w;x+=180)for(let y=0;y<state.world.h;y+=180)ctx.strokeRect(x,y,180,180);
let rs=state.floorDef.regionStyle||{};ctx.globalAlpha=.16;ctx.strokeStyle=rs.accent||"#62e9ff";ctx.lineWidth=2;for(let i=0;i<18;i++){let x=(i*317+state.floor*71)%state.world.w,y=(i*181+state.floor*113)%state.world.h;ctx.beginPath();ctx.arc(x,y,35+(i%4)*18,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;
for(let i=0;i<12;i++){let x=(i*401+state.floor*97)%state.world.w,y=(i*239+state.floor*53)%state.world.h;ctx.fillStyle=rs.accent||"#62e9ff";ctx.globalAlpha=.08;ctx.fillRect(x,y,80+(i%3)*35,6)}ctx.globalAlpha=1;
for(let o of (state.mapObjects||[])){ctx.save();ctx.translate(o.x,o.y);ctx.globalAlpha=.72;ctx.fillStyle=rs.accent||"#62e9ff";ctx.strokeStyle="#15243a";ctx.lineWidth=5;if(o.kind===0){ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h)}else if(o.kind===1){ctx.beginPath();ctx.arc(0,0,Math.min(o.w,o.h)/2,0,Math.PI*2);ctx.fill();ctx.stroke()}else if(o.kind===2){ctx.rotate(Math.PI/4);ctx.fillRect(-o.w/3,-o.h/3,o.w/1.5,o.h/1.5);ctx.strokeRect(-o.w/3,-o.h/3,o.w/1.5,o.h/1.5)}else{for(let j=0;j<4;j++){ctx.rotate(Math.PI/2);ctx.fillRect(0,-3,o.w/2,6)}}ctx.restore()}
for(let q of state.projectiles){ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fillStyle=q.owner==="boss"?"#ffd46b":q.owner==="enemy"?"#ff5f7f":"#62e9ff";ctx.shadowBlur=18;ctx.shadowColor=ctx.fillStyle;ctx.fill();ctx.shadowBlur=0}
state.enemies.forEach(drawEnemy);if(state.boss)drawBoss(state.boss);state.players.forEach(p=>drawTank(p,p.id===myId));for(let e of state.effects){let age=Math.max(0,1-e.t/(e.type==="blackhole"?3.2:1));ctx.save();ctx.translate(e.x,e.y);ctx.globalAlpha=.85;let col=e.type==="meteor"?"#ff8b45":e.type==="blackhole"?"#9a6cff":e.type==="heal"?"#6fffb0":e.type==="storm"?"#b09cff":"#62e9ff";ctx.strokeStyle=col;ctx.fillStyle=col;ctx.shadowBlur=30;ctx.shadowColor=col;ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,(e.type==="blackhole"?170:260)*age,0,Math.PI*2);ctx.stroke();if(e.type==="blackhole"){ctx.rotate(performance.now()/500);for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.fillRect(80,-3,80,6)}}if(e.type==="meteor"){ctx.beginPath();ctx.arc(0,0,70+220*age,0,Math.PI*2);ctx.fillStyle=col+"22";ctx.fill()}ctx.restore()}}
function drawTank(p,me){ctx.save();ctx.translate(p.x,p.y);let ang=Math.atan2(mouse.y-H/2,mouse.x-W/2);ctx.rotate(ang);ctx.globalAlpha=p.downed?.35:1;let bob=Math.sin(performance.now()/90+p.x*.01)*1.5;ctx.translate(0,bob);ctx.fillStyle="#101a29";ctx.fillRect(-43,-28,86,56);ctx.fillStyle=me?"#55dff0":"#c6d2e5";ctx.fillRect(-32,-24,64,48);ctx.fillStyle="#25374d";ctx.fillRect(-46,-29,12,58);ctx.fillRect(34,-29,12,58);ctx.fillStyle=me?"#a6f8ff":"#f0f3f7";ctx.fillRect(4,-7,68,14);ctx.fillStyle="#0b111c";ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();ctx.restore();ctx.fillStyle="#e4edf8";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText(p.name,p.x,p.y-48)}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();ctx.fillStyle="#111722";ctx.beginPath();ctx.arc(0,0,e.r*.42,0,7);ctx.fill();ctx.restore();ctx.fillStyle="#080c13";ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);ctx.fillStyle=e.color;ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*Math.max(0,e.hp/e.maxHp),4)}
function drawBoss(b){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(performance.now()/1300);ctx.strokeStyle="#e2b458";ctx.lineWidth=11;ctx.shadowBlur=38;ctx.shadowColor="#f0bc52";ctx.beginPath();ctx.arc(0,0,b.r+24,0,7);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle="#13151e";ctx.beginPath();ctx.arc(0,0,b.r,0,7);ctx.fill();ctx.fillStyle=b.phase===2?"#ff5e7d":"#d6a449";ctx.beginPath();ctx.arc(0,0,48,0,7);ctx.fill();for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.fillRect(Math.cos(a)*105-8,Math.sin(a)*105-8,16,16)}ctx.restore()}
draw();
</script></body></html>
