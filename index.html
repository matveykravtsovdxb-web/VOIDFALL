<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REALMFALL Online</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040a;color:#fff;font-family:Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.hidden{display:none!important}
.screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#35136b55,transparent 45%),linear-gradient(145deg,#02030a,#0c0717,#02030a)}
.panel{width:min(680px,92vw);padding:38px;border:1px solid #ffffff18;border-radius:26px;background:#0a0c15ee;box-shadow:0 35px 100px #000b,inset 0 1px #ffffff10;text-align:center;backdrop-filter:blur(18px)}
.logo{font:900 clamp(44px,8vw,82px)/1 Georgia;letter-spacing:9px;margin:0;background:linear-gradient(#fff,#d8b4fe,#7c3aed);-webkit-background-clip:text;color:transparent}.sub{color:#969bb0;letter-spacing:4px;text-transform:uppercase;font-size:11px;margin:10px 0 30px}.input,.btn{width:100%;padding:15px;border-radius:13px;border:1px solid #ffffff18;font-size:15px}.input{background:#0008;color:#fff;outline:0;margin:6px 0}.btn{margin-top:10px;border:0;color:#fff;font-weight:800;letter-spacing:1px;cursor:pointer;background:linear-gradient(135deg,#6d28d9,#a855f7);box-shadow:0 10px 30px #7c3aed33}.btn.alt{background:#ffffff0d;box-shadow:none}.btn.green{background:linear-gradient(135deg,#047857,#10b981)}.code{font:900 45px Georgia;letter-spacing:12px;color:#d8b4fe;margin:22px}.slot{display:flex;justify-content:space-between;padding:13px;border:1px solid #ffffff10;background:#ffffff06;border-radius:12px;margin:7px 0}.note{color:#777c92;font-size:12px;line-height:1.6;margin-top:14px}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}.hero{position:absolute;top:18px;left:18px;width:290px;padding:14px;border-radius:16px;background:#070912d9;border:1px solid #ffffff14;backdrop-filter:blur(12px)}.bar{height:9px;background:#181a25;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%}.hp{background:linear-gradient(90deg,#ef4444,#fb7185)}.xp{background:linear-gradient(90deg,#7c3aed,#c084fc)}.en{background:linear-gradient(90deg,#0891b2,#67e8f9)}.stats{display:flex;justify-content:space-between;font-size:11px;color:#aeb2c4;margin-top:6px}.party{position:absolute;right:18px;top:18px;width:220px}.ptitle{font-size:10px;letter-spacing:3px;color:#777c92}.member{background:#070912d9;border:1px solid #ffffff10;border-radius:12px;padding:9px;margin:6px 0}.mini{height:5px;background:#202331;border-radius:9px;overflow:hidden;margin-top:6px}.mini i{display:block;height:100%;background:#34d399}.boss{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:min(800px,65vw);text-align:center}.bname{font:900 22px Georgia;letter-spacing:5px;text-shadow:0 3px 20px #000}.bsub{font-size:10px;color:#aaa5b5;letter-spacing:3px;margin:3px 0 8px}.bouter{height:24px;padding:3px;background:linear-gradient(90deg,#9b7b2c,#f3d47b,#9b7b2c);clip-path:polygon(0 50%,2% 12%,8% 0,92% 0,98% 12%,100% 50%,98% 88%,92% 100%,8% 100%,2% 88%)}.binner{height:100%;background:#07060b}.bfill{height:100%;background:linear-gradient(90deg,#4c1d95,#9333ea,#d8b4fe);box-shadow:0 0 20px #9333ea}.floor{position:absolute;bottom:18px;left:18px;font:15px Georgia;letter-spacing:2px}.controls{position:absolute;bottom:18px;right:18px;text-align:right;color:#777c92;font-size:11px;line-height:1.7}.hotbar{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.skill{width:58px;height:58px;display:grid;place-items:center;border:1px solid #ffffff18;background:#070912e8;border-radius:13px;font-size:24px}.skill small{position:absolute;margin:35px 0 0 34px;color:#777c92;font-size:9px}
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#02030acc;backdrop-filter:blur(10px)}.shop{width:min(980px,94vw);padding:28px;border:1px solid #ffffff16;border-radius:22px;background:#0a0c15;box-shadow:0 30px 100px #000b}.shop h2{text-align:center;font:900 27px Georgia;letter-spacing:4px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{min-height:190px;padding:16px;border:1px solid #ffffff12;border-radius:16px;background:linear-gradient(145deg,#171a29,#0d0f18)}.rar{font-size:10px;letter-spacing:2px;text-transform:uppercase}.common{color:#b7becb}.rare{color:#38bdf8}.epic{color:#c084fc}.mythic{color:#f59e0b}.legendary{color:#facc15}.secret{color:#f472b6}.card h3{margin:8px 0}.card p{font-size:11px;color:#9da1b4;line-height:1.5}.price{color:#fbbf24;font-weight:800;margin:12px 0}.card button{width:100%;padding:9px;border:0;border-radius:9px;background:#7c3aed;color:#fff;cursor:pointer}.toast{position:fixed;z-index:100;top:18px;left:50%;transform:translateX(-50%);background:#171827;border:1px solid #ffffff14;padding:12px 18px;border-radius:12px}
@media(max-width:800px){.party{width:160px}.hero{width:220px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.party,.controls{display:none}.hero{top:8px;left:8px}.boss{top:8px}}
</style></head><body>
<canvas id="game"></canvas>
<div id="menu" class="screen"><div class="panel"><h1 class="logo">REALMFALL</h1><div class="sub">Online Co-op Roguelike RPG</div><input id="name" class="input" maxlength="16" placeholder="Hero name"><button id="create" class="btn">CREATE LOBBY</button><input id="join" class="input" maxlength="6" placeholder="6-character lobby code"><button id="joinBtn" class="btn alt">JOIN FRIEND</button><div class="note">Up to 4 players. Each player uses their own device.</div></div></div>
<div id="lobby" class="screen hidden"><div class="panel"><div class="sub">YOUR PARTY AWAITS</div><div id="code" class="code">------</div><div id="slots"></div><button id="start" class="btn green">START ASCENSION</button><button id="leave" class="btn alt">LEAVE</button></div></div>
<div id="hud" class="hidden"><div class="hero"><b id="heroName">Hero</b> <small id="lvl">LVL 1</small><div class="bar"><i id="hp" class="hp"></i></div><div class="bar"><i id="xp" class="xp"></i></div><div class="bar"><i id="en" class="en"></i></div><div class="stats"><span id="hpText"></span><span id="gold"></span><span id="energyText"></span></div></div>
<div id="boss" class="boss hidden"><div id="bossName" class="bname"></div><div id="bossSub" class="bsub"></div><div class="bouter"><div class="binner"><div id="bossFill" class="bfill"></div></div></div></div>
<div class="party"><div class="ptitle">PARTY</div><div id="partyList"></div></div><div id="floor" class="floor"></div><div class="controls">WASD / ARROWS — MOVE<br>CLICK — ATTACK · SPACE — DASH · Q — ABILITY</div><div class="hotbar"><div class="skill">⚔<small>CLICK</small></div><div class="skill">➤<small>SPACE</small></div><div class="skill">✦<small>Q</small></div></div></div>
<div id="shopOverlay" class="overlay hidden"><div class="shop"><h2>SANCTUM OF ASCENSION</h2><div id="shopGrid" class="grid"></div><button id="ascend" class="btn green">ASCEND</button></div></div><div id="toast" class="toast hidden"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
// Multiplayer FIX: never call io() when the Socket.IO client is unavailable.
if (typeof window.io !== "function") {
  document.body.innerHTML = `
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:#050712;color:white;font-family:system-ui;padding:24px;text-align:center">
      <div style="max-width:620px;padding:30px;border:1px solid #394578;border-radius:22px;background:#101528;box-shadow:0 30px 90px #000">
        <h1 style="margin-top:0">REALMFALL SERVER REQUIRED</h1>
        <p style="color:#aeb7d4;line-height:1.6">This is the online multiplayer version. Opening <b>index.html</b> directly cannot provide Socket.IO, so the game must be started through <b>server.js</b>.</p>
        <pre style="background:#050812;padding:15px;border-radius:12px;color:#8be9ff;text-align:left">npm install
npm start

Then open: http://localhost:3000</pre>
      </div>
    </div>`;
  throw new Error("REALMFALL needs server.js; open http://localhost:3000 instead of the HTML preview.");
}
const socket=window.io(),$=id=>document.getElementById(id);let state=null,myId=null,keys={},input={up:false,down:false,left:false,right:false,attack:false,dash:false,ability:false,aimX:1,aimY:0},cam={x:0,y:0};
function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");clearTimeout(window.t);window.t=setTimeout(()=>$("toast").classList.add("hidden"),2200)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function heroName(){return ($("name").value.trim()||"Hero").slice(0,16)}
$("create").onclick=()=>socket.emit("createLobby",{name:heroName()});
$("joinBtn").onclick=()=>{let c=$("join").value.trim().toUpperCase();if(c.length!==6)return toast("Enter a 6-character code.");socket.emit("joinLobby",{code:c,name:heroName()})};
$("start").onclick=()=>socket.emit("startGame");$("leave").onclick=()=>location.reload();$("ascend").onclick=()=>socket.emit("nextFloor");
socket.on("lobbyCreated",d=>{myId=d.playerId;openLobby(d.code)});socket.on("lobbyJoined",d=>{myId=d.playerId;openLobby(d.code)});socket.on("errorMessage",toast);socket.on("gameStarted",()=>showGame());
socket.on("state",s=>{state=s;if(!s.started){renderLobby();return}showGame();$("shopOverlay").classList.toggle("hidden",s.floorType!=="shop");if(s.floorType==="shop")renderShop()});
function showGame(){$("menu").classList.add("hidden");$("lobby").classList.add("hidden");$("hud").classList.remove("hidden")}
function openLobby(c){$("menu").classList.add("hidden");$("lobby").classList.remove("hidden");$("code").textContent=c}
function renderLobby(){if(!state)return;$("code").textContent=state.code;$("slots").innerHTML=state.players.map(p=>`<div class="slot"><span>⚔ ${esc(p.name)}</span><span>${p.id===state.hostId?"HOST":"READY"}</span></div>`).join("");$("start").style.display=state.hostId===myId?"block":"none"}
function renderShop(){$("shopGrid").innerHTML=state.shopOffers.map((c,i)=>!c?`<div class="card"><b>PURCHASED</b></div>`:`<div class="card"><div class="rar ${c.rarity}">${c.rarity}</div><h3>${esc(c.name)}</h3><p>${esc(c.description)}</p><div class="price">◆ ${c.price}</div><button onclick="buy(${i})">BUY</button></div>`).join("")}
window.buy=i=>socket.emit("buyCard",i);
function send(){socket.emit("input",input)}
function sync(){input.up=!!(keys.KeyW||keys.ArrowUp);input.down=!!(keys.KeyS||keys.ArrowDown);input.left=!!(keys.KeyA||keys.ArrowLeft);input.right=!!(keys.KeyD||keys.ArrowRight);send()}
addEventListener("keydown",e=>{keys[e.code]=true;sync();if(e.code==="Space"){input.dash=true;send()}if(e.code==="KeyQ"){input.ability=true;send()}});
addEventListener("keyup",e=>{keys[e.code]=false;sync();if(e.code==="Space"){input.dash=false;send()}});
$("game").addEventListener("mousedown",e=>{if(e.button===0){input.attack=true;send()}});addEventListener("mouseup",e=>{if(e.button===0){input.attack=false;send()}});
addEventListener("mousemove",e=>{let x=e.clientX-innerWidth/2,y=e.clientY-innerHeight/2,l=Math.hypot(x,y)||1;input.aimX=x/l;input.aimY=y/l});setInterval(send,80);
const canvas=$("game"),ctx=canvas.getContext("2d");function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(d,0,0,d,0,0)}addEventListener("resize",resize);resize();
function me(){return state?.players?.find(p=>p.id===myId)}function s(x,y){return{x:x-cam.x,y:y-cam.y}}
function draw(){let g=ctx.createRadialGradient(innerWidth/2,innerHeight/2,20,innerWidth/2,innerHeight/2,900);g.addColorStop(0,"#17112b");g.addColorStop(.55,"#080a14");g.addColorStop(1,"#020308");ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(-cam.x,-cam.y);ctx.strokeStyle="#a855f722";ctx.lineWidth=5;ctx.strokeRect(50,100,2500,1300);ctx.strokeStyle="#ffffff08";ctx.lineWidth=1;for(let x=50;x<2550;x+=100){ctx.beginPath();ctx.moveTo(x,100);ctx.lineTo(x,1400);ctx.stroke()}for(let y=100;y<1400;y+=100){ctx.beginPath();ctx.moveTo(50,y);ctx.lineTo(2550,y);ctx.stroke()}ctx.restore()}
function drawPlayer(p){let q=s(p.x,p.y);ctx.save();ctx.translate(q.x,q.y);ctx.globalAlpha=p.alive?1:.3;ctx.shadowColor=p.id===myId?"#a855f7":"#22d3ee";ctx.shadowBlur=28;ctx.fillStyle=p.id===myId?"#8b5cf6":"#22d3ee";ctx.globalAlpha*=.15;ctx.beginPath();ctx.arc(0,0,50,0,Math.PI*2);ctx.fill();ctx.globalAlpha=p.alive?1:.3;ctx.shadowBlur=0;ctx.fillStyle="#151722";ctx.beginPath();ctx.arc(0,-28,23,0,Math.PI*2);ctx.fill();ctx.fillStyle="#73798b";ctx.beginPath();ctx.roundRect(-21,-8,42,45,10);ctx.fill();ctx.fillStyle="#a855f7";ctx.fillRect(-11,-29,22,4);ctx.strokeStyle="#fff";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(17,-4);ctx.lineTo(58,-37);ctx.stroke();ctx.restore();ctx.textAlign="center";ctx.font="bold 11px Arial";ctx.fillStyle="#fff";ctx.fillText(p.name,q.x,q.y-58)}
function drawEnemy(e){let q=s(e.x,e.y),c=e.color||"#a855f7";ctx.save();ctx.translate(q.x,q.y);ctx.shadowColor=c;ctx.shadowBlur=25;ctx.globalAlpha=.2;ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,e.radius+12,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.fillStyle="#171421";ctx.beginPath();ctx.arc(0,0,e.radius,0,Math.PI*2);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,-4,e.radius*.65,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.fillRect(-10,-7,7,4);ctx.fillRect(3,-7,7,4);ctx.restore();ctx.fillStyle="#000b";ctx.fillRect(q.x-e.radius,q.y-e.radius-12,e.radius*2,4);ctx.fillStyle=c;ctx.fillRect(q.x-e.radius,q.y-e.radius-12,e.radius*2*Math.max(0,e.hp/e.maxHp),4)}
function drawBoss(b){let q=s(b.x,b.y),c=b.color||"#a855f7";ctx.save();ctx.translate(q.x,q.y);ctx.shadowColor=c;ctx.shadowBlur=70;ctx.globalAlpha=.18;ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,170,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.fillStyle="#090911";ctx.beginPath();ctx.roundRect(-85,-50,170,190,35);ctx.fill();ctx.fillStyle="#555a6c";ctx.beginPath();ctx.roundRect(-60,-30,120,120,22);ctx.fill();ctx.fillStyle="#10111a";ctx.beginPath();ctx.arc(0,-85,58,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d1d5db";ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(-30,-115);ctx.lineTo(-65,-160);ctx.moveTo(30,-115);ctx.lineTo(65,-160);ctx.stroke();ctx.strokeStyle=c;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-28,-85);ctx.lineTo(-5,-80);ctx.moveTo(28,-85);ctx.lineTo(5,-80);ctx.stroke();ctx.restore()}
function updateHud(){let p=me();if(!p)return;$("heroName").textContent=p.name;$("lvl").textContent="LVL "+p.level;$("hp").style.width=Math.max(0,p.hp/p.maxHp*100)+"%";$("xp").style.width=Math.max(0,p.xp/p.xpNeed*100)+"%";$("en").style.width=Math.max(0,p.energy/p.maxEnergy*100)+"%";$("hpText").textContent=Math.ceil(p.hp)+"/"+p.maxHp;$("energyText").textContent=Math.ceil(p.energy)+"/"+p.maxEnergy;$("gold").textContent="◆ "+p.gold;$("floor").textContent="FLOOR "+state.floor+" · "+state.floorType;$("partyList").innerHTML=state.players.map(x=>`<div class="member"><b>${x.id===myId?"★ ":""}${esc(x.name)}</b><div class="mini"><i style="width:${Math.max(0,x.hp/x.maxHp*100)}%"></i></div></div>`).join("");let b=state.boss;$("boss").classList.toggle("hidden",!b);if(b){$("bossName").textContent=b.name;$("bossSub").textContent=b.subtitle+" · PHASE "+b.phase;$("bossFill").style.width=Math.max(0,b.hp/b.maxHp*100)+"%"}}
function loop(){let p=me();if(p){cam.x+=(p.x-innerWidth/2-cam.x)*.1;cam.y+=(p.y-innerHeight/2-cam.y)*.1}draw();if(state?.started){state.enemies.forEach(drawEnemy);if(state.boss)drawBoss(state.boss);state.players.forEach(drawPlayer);updateHud()}requestAnimationFrame(loop)}loop();
</script></body></html>
